name: Update channels

on:
  schedule:
    # Releases are published a few times a day. Six-hourly refreshes keep the
    # channels close to the releases without polling GitHub on every push.
    - cron: "23 */6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [k0s-release]

# Grant nothing by default. Only the job below may write, so a future job
# cannot inherit write access by accident.
permissions: {}

concurrency:
  group: update-channels
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Regenerate channels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_channels.py
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "Channels are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- stable latest unstable
          git commit -m "Update channels from k0s releases"
          git push
