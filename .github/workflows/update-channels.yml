name: Update channel

on:
  # The k0s repository calls this when a release is published.
  repository_dispatch:
    types: [k0s-release]
  workflow_dispatch:
    inputs:
      version:
        description: k0s release version, for example 1.37.2+k0s.1
        required: true
      latest:
        description: Also move the latest/* channel for this release
        type: boolean
        default: false
      unstable:
        description: Publish a pre-release to its unstable channel
        type: boolean
        default: false

# Grant nothing by default. Only the job below may write, so a future job
# cannot inherit write access by accident.
permissions: {}

concurrency:
  group: update-channel-${{ inputs.version || github.event.client_payload.version }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve inputs
        id: inputs
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_LATEST: ${{ inputs.latest }}
          DISPATCH_UNSTABLE: ${{ inputs.unstable }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          version=${DISPATCH_VERSION:-$(jq -r '.version // ""' <<<"$PAYLOAD")}
          if [ -z "$version" ]; then
            echo "::error::no k0s version given"
            exit 1
          fi
          {
            echo "version=$version"
            echo "latest=${DISPATCH_LATEST:-$(jq -r '.latest // false' <<<"$PAYLOAD")}"
            echo "unstable=${DISPATCH_UNSTABLE:-$(jq -r '.unstable // false' <<<"$PAYLOAD")}"
          } >>"$GITHUB_OUTPUT"

      - name: Update channel files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.inputs.outputs.version }}
          LATEST: ${{ steps.inputs.outputs.latest }}
          UNSTABLE: ${{ steps.inputs.outputs.unstable }}
        run: |
          set -eu
          set -- "$VERSION"
          if [ "$(printf '%s' "$LATEST" | tr '[:upper:]' '[:lower:]')" = true ]; then
            set -- "$@" --latest
          fi
          if [ "$(printf '%s' "$UNSTABLE" | tr '[:upper:]' '[:lower:]')" = true ]; then
            set -- "$@" --unstable
          fi
          sh scripts/update_channel.sh "$@"

      - name: Open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Channels already match $VERSION."
            exit 0
          fi
          branch="channel/k0s-${VERSION//+/-}"
          git checkout -B "$branch"
          git commit -m "Update channels for k0s $VERSION"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "Updated the open pull request for $branch."
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title "Update channels for k0s $VERSION" \
            --body "Generated by the update channel workflow for [k0s $VERSION](https://github.com/k0sproject/k0s/releases/tag/v$VERSION).

          Review the version and the channel it lands in, then merge. GitHub Pages
          serves the file once it is on main."
