name: Update channel

on:
  # The k0s repository calls this when a release is published.
  repository_dispatch:
    types: [k0s-release]
  workflow_dispatch:
    inputs:
      version:
        description: k0s release version, for example 1.37.2+k0s.1
        required: true
      latest:
        description: Also move the latest/* channel for this release
        type: boolean
        default: false
      unstable:
        description: Publish a pre-release to its unstable channel
        type: boolean
        default: false

# Grant nothing by default. Only the job below may write, so a future job
# cannot inherit write access by accident.
permissions: {}

concurrency:
  group: update-channel-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The default branch, whatever ref the caller asked for: a pull request
      # from a dispatch branch would carry that branch's commits with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve inputs
        id: inputs
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_LATEST: ${{ inputs.latest }}
          DISPATCH_UNSTABLE: ${{ inputs.unstable }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          version=${DISPATCH_VERSION:-$(jq -r '.version // ""' <<<"$PAYLOAD")}
          if [ -z "$version" ]; then
            echo "::error::no k0s version given"
            exit 1
          fi
          # Strip the tag prefix here so "v1.37.2+k0s.1" and "1.37.2+k0s.1"
          # name the same branch. The script does the real validation.
          version=${version#v}
          {
            echo "version=$version"
            echo "latest=${DISPATCH_LATEST:-$(jq -r '.latest // false' <<<"$PAYLOAD")}"
            echo "unstable=${DISPATCH_UNSTABLE:-$(jq -r '.unstable // false' <<<"$PAYLOAD")}"
          } >>"$GITHUB_OUTPUT"

      - name: Update channel files
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.inputs.outputs.version }}
          LATEST: ${{ steps.inputs.outputs.latest }}
          UNSTABLE: ${{ steps.inputs.outputs.unstable }}
        run: |
          set -eu
          set -- "$VERSION"
          if [ "$(printf '%s' "$LATEST" | tr '[:upper:]' '[:lower:]')" = true ]; then
            set -- "$@" --latest
          fi
          if [ "$(printf '%s' "$UNSTABLE" | tr '[:upper:]' '[:lower:]')" = true ]; then
            set -- "$@" --unstable
          fi
          sh scripts/update_channel.sh "$@"

      - name: Open pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.inputs.outputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Channels already match $VERSION."
            exit 0
          fi
          branch="channel/k0s-${VERSION//+/-}"
          git checkout -B "$branch"
          git commit -m "Update channels for k0s $VERSION"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"

          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "Updated the open pull request #$number for $branch."
            exit 0
          fi
          # Pushing a closed or merged pull request's branch cannot open a new
          # one, so say what a human has to do instead of failing the run.
          number=$(gh pr list --head "$branch" --state closed --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "::warning::pull request #$number for $branch is closed or merged; reopen it or delete the branch."
            exit 0
          fi

          {
            printf 'Generated by the update channel workflow for [k0s %s](https://github.com/k0sproject/k0s/releases/tag/v%s).\n\n' "$VERSION" "$VERSION"
            printf 'Review the version and the channel it lands in, then merge. '
            printf 'GitHub Pages serves the files once they are on %s.\n' "$BASE"
          } >"$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$BASE" --head "$branch" \
            --title "Update channels for k0s $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"
